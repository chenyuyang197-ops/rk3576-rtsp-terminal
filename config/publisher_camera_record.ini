# RTSP 录制专用：IMX415 实采 + 板载麦 AAC（非 testpattern）
rtspPort = 554
runSeconds = 0
width = 720
height = 1280
fps = 30
videoSource = camera
cameraDevice = /dev/video-camera0
cameraWidth = 1920
cameraHeight = 1080
cameraRotation = 270
enableAudio = 1
audioDevice = hw:0,0
rtspStreamChannels = 1
localNv12Tap = 0

eth0StaticIp = 192.168.1.100
eth0Netmask = 255.255.255.0
simulateNetwork = 1
