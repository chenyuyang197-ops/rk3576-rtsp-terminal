# 麦克风验收专用：testpattern 视频 + AAC 采集 + local audio tap（不占 MIPI）
rtspPort = 554
runSeconds = 0
width = 720
height = 1280
fps = 25
videoSource = testpattern
enableAudio = 1
rtspStreamChannels = 1
localNv12Tap = 1
audioDevice = hw:0,0

eth0StaticIp = 192.168.1.100
eth0Netmask = 255.255.255.0
simulateNetwork = 1
